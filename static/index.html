<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Minimal Agent</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;font:15px system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#172033;display:flex}aside{width:250px;background:#172033;color:#fff;padding:22px 14px;overflow:auto}aside>button{width:100%;border:0;border-radius:9px;padding:11px;background:#4f7cff;color:#fff;font-size:15px;cursor:pointer}#sessions{margin-top:18px}#sessions div{display:flex;gap:4px;margin:6px 0}#sessions div button:first-child{flex:1;text-align:left;background:#24334f;color:#e8eefc;border:0;border-radius:7px;padding:10px;cursor:pointer}#sessions div button:last-child{border:0;border-radius:7px;background:#394866;color:#cbd5e8;cursor:pointer}main{flex:1;max-width:900px;margin:auto;padding:28px 36px;display:flex;flex-direction:column;height:100vh}h1{margin:0 0 18px;font-size:24px}#log{flex:1;overflow:auto;background:#fff;border:1px solid #e1e6ef;border-radius:14px;padding:22px;box-shadow:0 5px 20px #1b2b4a0d}.u,.a{max-width:80%;padding:11px 14px;border-radius:12px;margin:10px 0;line-height:1.55;white-space:pre-wrap}.u{margin-left:auto;background:#e8f0ff;color:#2454b8}.a{background:#f0f3f8;color:#25324a}p{display:flex;gap:10px;margin:18px 0 0}input{flex:1;padding:13px 15px;border:1px solid #d5ddea;border-radius:10px;font-size:15px;outline:none}input:focus{border-color:#4f7cff}main p button{border:0;border-radius:10px;padding:0 22px;background:#4f7cff;color:#fff;font-size:15px;cursor:pointer}@media(max-width:650px){aside{width:180px}main{padding:20px 12px}.u,.a{max-width:95%}}
</style>
<aside><button onclick="newChat()">＋ 新建会话</button><div id="sessions"></div></aside><main><h1>Minimal Agent</h1><div id="log"></div><p><input id="msg" placeholder="输入消息"><button onclick="send()">发送</button></p></main>
<script>
const log=document.querySelector('#log'),input=document.querySelector('#msg'),list=document.querySelector('#sessions');let sessions=JSON.parse(localStorage.sessions||'[]'),sid;
function save(){localStorage.sessions=JSON.stringify(sessions)} function render(){list.innerHTML='';sessions.forEach(s=>{let row=document.createElement('div'),b=document.createElement('button'),x=document.createElement('button');b.textContent=s.name;b.onclick=()=>switchChat(s.id);x.textContent='删除';x.onclick=()=>deleteChat(s.id);row.append(b,x);list.appendChild(row)})}
async function deleteChat(id){await fetch('/api/sessions/'+id,{method:'DELETE'});sessions=sessions.filter(s=>s.id!==id);save();if(sid===id){sid=null;log.innerHTML='';if(sessions.length)switchChat(sessions[0].id);else newChat()}render()}
function add(c,t){let d=document.createElement('div');d.className=c;d.textContent=t;log.appendChild(d)}
async function switchChat(id){sid=id;log.innerHTML='';let d=await (await fetch('/api/sessions/'+id)).json();(d.messages||[]).forEach(m=>{if(m.role==='user')add('u','你：'+m.content);else if(m.role==='assistant'&&m.content)add('a','Agent：'+m.content)});render()}
function newChat(){sid=crypto.randomUUID();sessions.push({id:sid,name:'会话 '+(sessions.length+1)});save();render();log.innerHTML='';add('a','已创建新会话')}
async function send(){let message=input.value.trim();if(!message)return;if(!sid)newChat();input.value='';add('u','你：'+message);let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,message})});let d=await r.json();add('a','Agent：'+(d.answer||JSON.stringify(d)))}
if(sessions.length)switchChat(sessions[0].id);else newChat();input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script></html>
